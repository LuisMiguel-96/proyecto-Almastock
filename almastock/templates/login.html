{% extends 'base.html' %}
{% block title %}Iniciar sesión | AlmaStock{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4">
  <h1 class="h4 text-center mb-4">Iniciar sesión</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="email">Correo electrónico</label>
    <input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email">
    <label class="form-label" for="password">Contraseña</label>
    <input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-primary w-100">Ingresar</button>
  </form>
  <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
</div></div>
{% endblock %}
