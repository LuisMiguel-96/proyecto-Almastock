{% extends 'base.html' %}
{% block title %}Crear cuenta | AlmaStock{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4">
  <h1 class="h4 text-center mb-4">Crear cuenta</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="email">Correo electrónico</label>
    <input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email">
    <label class="form-label" for="password">Contraseña</label>
    <input class="form-control mb-3" id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
    <div class="form-text mb-3">Usa al menos 10 caracteres.</div>
    <button class="btn btn-success w-100">Registrarme</button>
  </form>
  <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a></p>
</div></div>
{% endblock %}
